<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Play 10-second demo">
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop offset="0" stop-color="#003e7e"/>
      <stop offset="1" stop-color="#001a36"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" rx="8" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="90"  x2="640" y2="90"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
  </g>

  <!-- three-layer band labels -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#ffffff" fill-opacity="0.55" font-size="13">
    <text x="80"  y="55" text-anchor="middle">Layer 1 · Data</text>
    <text x="320" y="55" text-anchor="middle">Layer 2 · Intelligence</text>
    <text x="560" y="55" text-anchor="middle">Layer 3 · Decision</text>
  </g>

  <!-- flow arrows -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="180" x2="200" y2="180"/>
    <polyline points="190,173 200,180 190,187"/>
    <line x1="280" y1="180" x2="360" y2="180"/>
    <polyline points="350,173 360,180 350,187"/>
    <line x1="440" y1="180" x2="520" y2="180"/>
    <polyline points="510,173 520,180 510,187"/>
  </g>

  <!-- layer blocks -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#ffffff" font-size="14">
    <rect x="20"  y="120" width="100" height="120" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="70"  y="155" text-anchor="middle" font-weight="bold">PDF / Excel</text>
    <text x="70"  y="180" text-anchor="middle">Charts</text>
    <text x="70"  y="200" text-anchor="middle">Policies</text>
    <text x="70"  y="225" text-anchor="middle" font-size="11" fill-opacity="0.65">VLM parser</text>

    <rect x="220" y="120" width="100" height="120" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="270" y="155" text-anchor="middle" font-weight="bold">Valuation</text>
    <text x="270" y="180" text-anchor="middle">Risk</text>
    <text x="270" y="200" text-anchor="middle">Trends</text>
    <text x="270" y="225" text-anchor="middle" font-size="11" fill-opacity="0.65">LoRA-tuned</text>

    <rect x="420" y="120" width="200" height="120" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="520" y="150" text-anchor="middle" font-weight="bold">NL query</text>
    <text x="520" y="180" text-anchor="middle">Portfolio</text>
    <text x="520" y="205" text-anchor="middle">Reports</text>
    <text x="520" y="228" text-anchor="middle" font-size="11" fill-opacity="0.65">decision DAG</text>
  </g>

  <!-- big play button -->
  <circle cx="320" cy="295" r="34" fill="#ffffff" fill-opacity="0.95"/>
  <circle cx="320" cy="295" r="34" fill="url(#glow)"/>
  <polygon points="308,278 308,312 338,295" fill="#003e7e"/>

  <text x="320" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" fill-opacity="0.85">Click to play · 10-second system flow</text>
</svg>
